<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<!-- a hand-written SVG with comments, gradients and symbol references -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="240.000" height="160.000" viewBox="0.000 0.000 240.000 160.000">
  <!-- gradient definitions: the two linearGradients are duplicates -->
  <defs>
    <linearGradient id="gradA" x1="0.000" y1="0.000" x2="1.000" y2="1.000">
      <stop offset="0.000" stop-color="#ff0000"/>
      <!-- midpoint comment -->
      <stop offset="0.500" stop-color="#00ff00"/>
      <stop offset="1.000" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="gradB" x1="0.000" y1="0.000" x2="1.000" y2="1.000">
      <stop offset="0.000" stop-color="#ff0000"/>
      <stop offset="0.500" stop-color="#00ff00"/>
      <stop offset="1.000" stop-color="#0000ff"/>
    </linearGradient>
    <radialGradient id="rad" cx="0.500" cy="0.500" r="0.500">
      <stop offset="0.000" stop-color="#ffffff" stop-opacity="1.000"/>
      <stop offset="1.000" stop-color="#222222" stop-opacity="0.750"/>
    </radialGradient>
    <!-- reusable symbol, referenced twice -->
    <symbol id="chip" viewBox="0 0 40 40">
      <rect x="0.000" y="0.000" width="40.000" height="40.000" rx="6.000"
            fill="url(#gradA)" stroke="#000000" stroke-width="1.500"/>
      <circle cx="20.000" cy="20.000" r="10.000" fill="url(#rad)"/>
    </symbol>
  </defs>
  <rect x="0.000" y="0.000" width="240.000" height="160.000" fill="#f4f4f4"/>
  <use href="#chip" x="20.000" y="20.000" width="80.000" height="80.000"/>
  <use xlink:href="#chip" x="120.000" y="20.000" width="80.000" height="80.000"/>
  <path d="M 20.000 130.000 C 60.000 100.000, 120.000 150.000, 220.000 120.000"
        fill="none" stroke="url(#gradB)" stroke-width="3.250"/>
  <text x="20.000" y="150.000" font-size="12.000">gradient + symbol</text>
</svg>
